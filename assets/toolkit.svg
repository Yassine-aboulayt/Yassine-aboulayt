<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Yassine Aboulayt's toolkit</title>
  <desc id="desc">Three toolkit groups. Web: HTML, CSS, JavaScript, and Tailwind CSS. Programming and data: C, Java, and SQL. Tools: VS Code, Windows, Git, GitHub, and Vercel.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1D31"/>
      <stop offset="1" stop-color="#081321"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <style>
      .card { fill: url(#card); stroke: #1B3A57; stroke-width: 1.2; }
      .heading { fill: #7DD3FC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 650; letter-spacing: 1px; }
      .item { fill: #E2E8F0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 23px; font-weight: 500; }
      .separator { fill: #3D6685; }
      .icon { fill: none; stroke: #38BDF8; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .divider { stroke: #19324B; stroke-width: 1; }
    </style>
  </defs>

  <g aria-label="Web: HTML, CSS, JavaScript, Tailwind CSS">
    <rect class="card" x="16" y="16" width="376" height="238" rx="16"/>
    <rect x="40" y="40" width="30" height="3" rx="1.5" fill="url(#accent)"/>
    <text class="heading" x="40" y="77">WEB</text>
    <g class="icon" transform="translate(329 46)" aria-hidden="true">
      <rect x="0" y="0" width="34" height="27" rx="4"/>
      <path d="M0 8h34M6 4h.01M11 4h.01M16 4h.01M13 14l-4 4 4 4M21 14l4 4-4 4"/>
    </g>
    <path class="divider" d="M40 96h328"/>
    <text class="item" x="40" y="143">HTML <tspan class="separator">·</tspan> CSS</text>
    <text class="item" x="40" y="189">JavaScript <tspan class="separator">·</tspan> Tailwind</text>
  </g>

  <g aria-label="Programming and data: C, Java, SQL">
    <rect class="card" x="412" y="16" width="376" height="238" rx="16"/>
    <rect x="436" y="40" width="30" height="3" rx="1.5" fill="url(#accent)"/>
    <text class="heading" x="436" y="77">PROGRAMMING &amp; DATA</text>
    <g class="icon" transform="translate(729 43)" aria-hidden="true">
      <ellipse cx="14" cy="5" rx="14" ry="5"/>
      <path d="M0 5v20c0 2.8 6.3 5 14 5s14-2.2 14-5V5M0 15c0 2.8 6.3 5 14 5s14-2.2 14-5"/>
    </g>
    <path class="divider" d="M436 96h328"/>
    <text class="item" x="436" y="143">C <tspan class="separator">·</tspan> Java</text>
    <text class="item" x="436" y="189">SQL</text>
  </g>

  <g aria-label="Tools: VS Code, Windows, Git, GitHub, Vercel">
    <rect class="card" x="808" y="16" width="376" height="238" rx="16"/>
    <rect x="832" y="40" width="30" height="3" rx="1.5" fill="url(#accent)"/>
    <text class="heading" x="832" y="77">TOOLS</text>
    <g class="icon" transform="translate(1121 46)" aria-hidden="true">
      <rect x="0" y="0" width="34" height="27" rx="4"/>
      <path d="M8 8l5 5-5 5M18 19h8"/>
    </g>
    <path class="divider" d="M832 96h328"/>
    <text class="item" x="832" y="143">VS Code <tspan class="separator">·</tspan> Windows</text>
    <text class="item" x="832" y="189">Git <tspan class="separator">·</tspan> GitHub <tspan class="separator">·</tspan> Vercel</text>
  </g>
</svg>
